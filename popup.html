<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <title>L++</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <img class="logo" src="favicon-ladok.png" alt="" />
      <div class="title">
        <h1>L++</h1>
        <p>Ladok med XP och statistik</p>
      </div>
      <button id="openOptions" class="icon-btn" title="Inställningar" aria-label="Inställningar">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
      </button>
    </header>

    <section class="card">
      <div class="stat">
        <span id="courseCount" class="stat-value">–</span>
        <span class="stat-label">kurser lagrade</span>
      </div>
      <p id="lastSeen" class="meta"></p>
      <p id="emptyHint" class="meta hidden">
        Öppna Min utbildning och kör <strong>Skanna alla</strong> för att hämta dina resultat.
      </p>

      <div id="clearRow" class="card-foot hidden">
        <button id="clearBtn" class="link-danger">Rensa sparad data</button>
      </div>

      <div id="confirmRow" class="confirm hidden">
        <p class="confirm-text">
          Ta bort resultatdata för <strong id="confirmCount"></strong>?
          Inställningarna påverkas inte.
        </p>
        <div class="confirm-actions">
          <button id="cancelClear" class="ghost">Avbryt</button>
          <button id="confirmClear" class="danger">Ta bort</button>
        </div>
      </div>
    </section>

    <div class="actions">
      <button id="openLadok" class="primary">Öppna Min utbildning</button>
    </div>

    <p class="foot">All data lagras lokalt i webbläsaren och skickas ingenstans.</p>

    <script src="popup.js"></script>
  </body>
</html>
